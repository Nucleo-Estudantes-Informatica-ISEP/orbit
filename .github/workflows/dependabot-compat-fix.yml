name: Dependabot compatibility fix

on:
  push:
    branches:
      - dependabot/npm_and_yarn/api/api-dependencies-8eee7dde8e

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dependabot branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Retain Prisma 6
        working-directory: api
        run: |
          npm install @prisma/client@6.19.3
          npm install --save-dev prisma@6.19.3

      - name: Commit repaired dependency set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/package.json api/package-lock.json
          git commit -m "fix(deps): retain Prisma 6 compatibility"
          git push origin HEAD:${GITHUB_REF_NAME}
