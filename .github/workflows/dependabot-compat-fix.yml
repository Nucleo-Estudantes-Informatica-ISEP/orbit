name: Dependabot compatibility fix

on:
  push:
    branches:
      - dependabot/npm_and_yarn/frontend/frontend-dependencies-84504d1a1e

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dependabot branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Merge current dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev
          git merge --no-commit --no-ff origin/dev

      - name: Restore supported frontend toolchain
        working-directory: frontend
        run: npm install --save-dev eslint@9.39.4 typescript@5.9.3

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run lint
          npx tsc --noEmit
          npm run build

      - name: Commit repaired dependency set
        run: |
          git add frontend/package.json frontend/package-lock.json
          git commit -m "fix(deps): keep frontend toolchain compatible"
          git push origin HEAD:${GITHUB_REF_NAME}
