name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/orbit_test?schema=public
  JWT_SECRET: ci-only-jwt-secret
  CORS_ORIGIN: https://ci.invalid

jobs:
  api-quality:
    name: API lint, typecheck, test, migrate & build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/orbit_test?schema=public
      JWT_SECRET: ci-only-jwt-secret
      CORS_ORIGIN: https://ci.invalid
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orbit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --runInBand

      - name: End-to-end smoke test
        run: npm run test:e2e -- --runInBand

      - name: Apply migrations to an isolated database
        run: npx prisma migrate deploy

      - name: Production build
        run: npm run build

      - name: Reject critical production dependency advisories
        run: npm audit --omit=dev --audit-level=critical

  frontend-quality:
    name: Frontend lint, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: File authentication regression tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Reject critical production dependency advisories
        run: npm audit --omit=dev --audit-level=critical

  docker:
    name: Production Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build API image
        run: docker build -t orbit-api-check ./api

      - name: Build frontend image
        run: docker build -t orbit-frontend-check ./frontend

      - name: Verify non-root runtimes
        run: |
          test "$(docker inspect --format '{{.Config.User}}' orbit-api-check)" = "node"
          test "$(docker inspect --format '{{.Config.User}}' orbit-frontend-check)" = "node"

      - name: Validate Coolify compose model
        env:
          SERVICE_URL_FRONTEND_3090: https://ci.invalid
          SERVICE_USER_POSTGRES: postgres
          SERVICE_PASSWORD_POSTGRES: postgres
          SERVICE_BASE64_64_JWT: ci-only-jwt-secret
          SERVICE_USER_MINIO: minio
          SERVICE_PASSWORD_MINIO: minio-password
          SMTP_PASS: ci-only-smtp-password
        run: |
          sed '/^[[:space:]]*exclude_from_hc:/d' docker-compose.coolify.yml \
            | docker compose -f - config --quiet
