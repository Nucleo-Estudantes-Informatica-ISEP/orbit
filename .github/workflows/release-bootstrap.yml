name: Release Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-bootstrap.yml
  workflow_dispatch: {}

jobs:
  bootstrap-v2:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BOOTSTRAP_SHA: fa572581540a8188dc1bc7b7e2e6ac43e9b0e66e
    steps:
      - name: Create release labels
        run: |
          gh label create release:major --color B60205 --description "Next merge to main creates a new major release" --force
          gh label create release:minor --color 0E8A16 --description "Next merge to main creates a new minor release" --force
          gh label create release:patch --color 1D76DB --description "Next merge to main creates a new patch release" --force

      - name: Publish ORBIT v2 baseline
        run: |
          set -euo pipefail

          if gh release view v2.0.0 >/dev/null 2>&1; then
            echo "v2.0.0 already exists; bootstrap is complete."
            exit 0
          fi

          cat > /tmp/release-notes.md <<EOF
          # ORBIT v2

          ORBIT v2 establishes the first formal release baseline for the NEI-ISEP internal operating system.

          ## Highlights

          - Unified internal platform for people, departments, projects, tasks, announcements, events, recruitment, inventory, plans and debts.
          - Next.js 16 / React 19 frontend backed by a NestJS 11 API and PostgreSQL through Prisma.
          - Permission-based RBAC with JWT/refresh-token authentication and administrative user/role management.
          - Internal MinIO storage for CVs, inventory photos, resources and plan documents.
          - Recruitment pipeline, project/task workflows, notifications and operational dashboards in one application.
          - Docker/Coolify deployment with isolated API, database and storage services plus health checks.

          This release is pinned to the main state at ${BOOTSTRAP_SHA}. Open stabilization work is intentionally excluded and will be released after merge through the automated versioning flow.

          Future PRs into main select exactly one semantic-version bump using release:major, release:minor or release:patch.
          EOF

          gh release create v2.0.0 \
            --target "$BOOTSTRAP_SHA" \
            --title "ORBIT v2" \
            --notes-file /tmp/release-notes.md \
            --latest
