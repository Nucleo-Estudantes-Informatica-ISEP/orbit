# documentation: https://github.com/diniscorreia/orbit
# slogan: ORBIT internal operating system
# category: productivity
# tags: nextjs,nestjs,postgres,minio
# port: 3090

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3090"
      HOSTNAME: "0.0.0.0"
      SERVICE_URL_FRONTEND_3090: ${SERVICE_URL_FRONTEND_3090}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3090').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    expose:
      - "3090"

  migrator:
    image: orbit-api
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@db:5432/orbit?schema=public
    depends_on:
      db:
        condition: service_healthy

  api:
    image: orbit-api
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_URL: ${APP_URL:-https://orbit.nei-isep.org}
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@db:5432/orbit?schema=public
      JWT_SECRET: ${SERVICE_BASE64_64_JWT}
      CORS_ORIGIN: ${APP_URL:-https://orbit.nei-isep.org}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${SERVICE_USER_MINIO}
      MINIO_SECRET_KEY: ${SERVICE_PASSWORD_MINIO}
      MINIO_BUCKET: orbit
      SMTP_HOST: mail.nei-isep.org
      SMTP_PORT: "465"
      SMTP_SECURE: "true"
      SMTP_USER: no-reply@nei-isep.org
      SMTP_PASS: ${SMTP_PASS:?Configure SMTP_PASS in Coolify}
      SMTP_FROM: ORBIT <no-reply@nei-isep.org>
    depends_on:
      migrator:
        condition: service_completed_successfully
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    expose:
      - "3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: orbit
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SERVICE_USER_MINIO}
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MINIO}
    volumes:
      - minio-data:/data
    expose:
      - "9000"

volumes:
  db-data:
  minio-data:
